services:
  postgres:
    image: postgres:16-alpine
    container_name: orgflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orgflow
    ports:
      - '5432:5432'
    volumes:
      - orgflow_pg:/var/lib/postgresql/data

volumes:
  orgflow_pg:
